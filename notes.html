<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rajasthan Notes & Study Material</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#102b49}.wrap{width:min(1160px,92%);margin:auto}header{background:linear-gradient(135deg,#102f4d,#1769e8);color:#fff;padding:23px 0}.head{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{margin:0;font-size:27px}header p{margin:6px 0;color:#dbeafe}nav{display:flex;gap:8px;flex-wrap:wrap}nav a{background:#fff;color:#102f4d;padding:9px 12px;border-radius:9px;font-weight:800;font-size:12px;text-decoration:none}.toolbar{margin:20px 0;background:#fff;border:1px solid #d9e3ef;border-radius:15px;padding:14px;display:grid;grid-template-columns:1.7fr 1fr;gap:9px}input,select{padding:11px;border:1px solid #ccd9e7;border-radius:9px;font:inherit}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.card{background:#fff;border:1px solid #d9e3ef;border-radius:15px;padding:16px;box-shadow:0 5px 18px #102b4908}.tag{display:inline-block;background:#eaf3ff;color:#1769e8;border-radius:999px;padding:5px 8px;font-size:10px;font-weight:800}.card h2{font-size:18px;margin:10px 0 6px}.desc{font-size:12px;color:#60738a;line-height:1.5;min-height:38px}.meta{font-size:11px;color:#60738a;margin:9px 0}.btn{display:inline-block;background:#1769e8;color:#fff;padding:9px 11px;border-radius:8px;text-decoration:none;font-size:11px;font-weight:800}.empty{grid-column:1/-1;background:#fff;padding:45px;text-align:center;border-radius:15px;color:#60738a}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.head{flex-direction:column;align-items:flex-start}}@media(max-width:520px){.grid,.toolbar{grid-template-columns:1fr}h1{font-size:23px}}</style></head><body>
<header><div class="wrap head"><div><h1>📚 Notes & Study Material</h1><p>Rajasthan GK • CET • Reasoning • Maths • Computer • Government Exams</p></div><nav><a href="index.html">🏠 Home</a><a href="government-jobs.html">🏛️ Govt Jobs</a><a href="upload-notes.html">📤 Upload Notes</a></nav></div></header>
<main class="wrap"><div class="toolbar"><input id="search" placeholder="Search notes, subject, title..."><select id="cat"><option value="">All Categories</option><option>Rajasthan GK</option><option>Reasoning</option><option>Maths</option><option>English</option><option>Hindi</option><option>Computer</option><option>CET</option><option>Government Exams</option><option>Current Affairs</option><option>Other</option></select></div><p id="count" style="font-size:12px;color:#60738a"></p><section id="grid" class="grid"><div class="empty">Loading notes…</div></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import {getFirestore,collection,getDocs,query,where} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyDO75-iuVlRP9emqnR-d1T4g66akuQS328",
  authDomain: "rajasthan-job.firebaseapp.com",
  projectId: "rajasthan-job",
  storageBucket: "rajasthan-job.firebasestorage.app",
  messagingSenderId: "894888753938",
  appId: "1:894888753938:web:92e66d7a7237be1fd9d1cb",
  measurementId: "G-15S2XJQK80"
};
const db=getFirestore(initializeApp(firebaseConfig)),$=id=>document.getElementById(id);let notes=[];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){const q=$("search").value.toLowerCase().trim(),c=$("cat").value,a=notes.filter(n=>(!q||[n.title,n.category,n.description,n.name].join(" ").toLowerCase().includes(q))&&(!c||n.category===c));$("count").textContent=a.length+" published material"+(a.length===1?"":"s");$("grid").innerHTML=a.length?a.map(n=>`<article class="card"><span class="tag">${esc(n.category)}</span><h2>${esc(n.title)}</h2><div class="desc">${esc(n.description||"Study material")}</div><div class="meta">👤 ${esc(n.name||"Contributor")}</div><a class="btn" target="_blank" rel="noopener" href="${esc(n.fileUrl)}">📄 Open / Download</a></article>`).join(""):'<div class="empty">📭 No published material found.</div>'}
async function load(){try{const s=await getDocs(query(collection(db,"notes"),where("status","==","approved")));notes=s.docs.map(d=>({id:d.id,...d.data()}));render()}catch(e){console.error(e);$("grid").innerHTML='<div class="empty">Notes load nahi ho paaye. Firestore rules check karein.</div>'}}$("search").oninput=render;$("cat").onchange=render;load();
</script></body></html>
