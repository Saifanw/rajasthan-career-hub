<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Job Details | Rajasthan Job</title><meta name="description" content="Verified job details on Rajasthan Job."><meta name="theme-color" content="#0a1d36">
<style>
:root{--navy:#102a43;--blue:#1769e8;--saffron:#f39a2f;--muted:#64748b;--line:#e1e8f0;--bg:#f6f8fc;--ink:#182536}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{width:min(920px,92%);margin:auto}
.bar{background:#0a1d36;color:#fff;padding:13px 0}.bar .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}
.bar b{font-weight:900}.bar a{color:#cfe0f5;font-weight:700}.bar a:hover{color:#fff}
.head{background:radial-gradient(700px 300px at 90% -20%,#1e4d8f,transparent 60%),linear-gradient(180deg,#0a1d36,#0d2748);color:#fff;padding:26px 0 70px}
.head h1{margin:6px 0 6px;font-size:clamp(24px,4vw,36px);line-height:1.15}
.co{color:#b9cbe3;font-weight:700;font-size:15px}
.tag{display:inline-block;background:var(--saffron);color:#fff;font-size:11px;font-weight:900;border-radius:6px;padding:2px 8px;margin-left:8px;vertical-align:middle}
main{margin-top:-48px;padding-bottom:110px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 18px 45px rgba(16,42,67,.1)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.fact{background:#f4f8fd;border-radius:12px;padding:11px 13px}.fact small{display:block;color:var(--muted);font-size:11px;font-weight:700}.fact b{display:block;color:var(--navy);font-size:14px;overflow-wrap:anywhere}
.fact.sal{background:#e8f6ef}.fact.sal b{color:#11623f}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:13px 22px;font-weight:900;font-size:15px;cursor:pointer;font-family:inherit}
.apply{background:var(--blue);color:#fff;box-shadow:0 10px 22px #1769e840}.apply:hover{background:#0b57d0}
.ghost{background:#fff;color:var(--navy);border:1px solid #cbd8e7;font-size:14px;padding:12px 16px}
.wa{background:#e9f9ef;color:#11623f;border:1px solid #bfe8cf}
h2{font-size:18px;color:var(--navy);margin:0 0 8px}
.sec{border-top:1px solid var(--line);margin-top:22px;padding-top:18px}
.sec p{margin:0;max-width:72ch;color:#2c3e55}
.note{font-size:12px;color:var(--muted);margin-top:18px;background:#fff8ec;border:1px solid #f6e2bd;border-radius:10px;padding:9px 12px}
.sim{margin-top:26px}.sim h2{margin-bottom:10px}
.simg{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.sc{display:block;background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:12px 14px}
.sc:hover,.sc:focus-visible{border-left-color:var(--saffron);background:#f4f9ff}
.sc b{display:block;color:var(--navy);font-size:14px}.sc span{font-size:12px;color:var(--muted)}
.sk{border-radius:10px;background:linear-gradient(90deg,#eef3f9 25%,#f8fbff 50%,#eef3f9 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.err{text-align:center;padding:34px 10px}.err h2{font-size:22px}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 4% calc(10px + env(safe-area-inset-bottom));display:none;gap:10px;z-index:20}
.sticky .btn{flex:1}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#0a1d36;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media(max-width:700px){.sticky.on{display:flex}.actions .apply{display:none}.card{padding:18px}}
a:focus-visible,button:focus-visible{outline:3px solid #7db4ff;outline-offset:2px}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style></head>
<body>
<div class="bar"><div class="wrap"><a href="index.html"><b>Rajasthan Job</b></a><a href="jobs.html">← Sab jobs dekhein</a></div></div>
<div class="head"><div class="wrap" id="head"><div class="sk" style="height:34px;width:70%;margin-top:10px"></div><div class="sk" style="height:18px;width:40%;margin-top:12px;opacity:.4"></div></div></div>
<main class="wrap">
  <div class="card" id="content"><div class="sk" style="height:60px"></div><div class="sk" style="height:140px;margin-top:14px"></div></div>
  <section class="sim" id="sim" hidden><h2>Milti-julti jobs</h2><div class="simg" id="simg"></div></section>
</main>
<div class="sticky" id="sticky"><a class="btn apply" id="stickyApply" target="_blank" rel="noopener noreferrer">Apply Now</a><button class="btn ghost wa" id="stickyWa" type="button">WhatsApp</button></div>
<div class="toast" id="toast" role="status">Link copy ho gaya</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import{getFirestore,doc,getDoc,collection,query,where,getDocs}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDO75-iuVlRP9emqnR-d1T4g66akuQS328",authDomain:"rajasthan-job.firebaseapp.com",projectId:"rajasthan-job",storageBucket:"rajasthan-job.firebasestorage.app",messagingSenderId:"894888753938",appId:"1:894888753938:web:92e66d7a7237be1fd9d1cb",measurementId:"G-15S2XJQK80"};
const db=getFirestore(initializeApp(firebaseConfig));
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id=new URLSearchParams(location.search).get('id');
const ms=j=>{const v=j.createdAt||j.postedAt;try{return v?.toDate?v.toDate().getTime():new Date(v||0).getTime()||0}catch(e){return 0}};
const fail=(t,m)=>{$('head').innerHTML='';$('content').innerHTML=`<div class="err"><h2>${t}</h2><p>${m}</p><a class="btn apply" href="jobs.html">Sab jobs dekhein</a></div>`};
function toast(){const t=$('toast');t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)}
async function load(){
  if(!id){fail('Job nahi mili','Link adhoora hai. Jobs list se dobara chunein.');return}
  try{
    const snap=await getDoc(doc(db,'jobs',id));
    if(!snap.exists()||snap.data().status!=='approved'){fail('Ye job ab available nahi hai','Ye vacancy review mein ho sakti hai ya expire ho chuki hai.');return}
    const j=snap.data(),t=ms(j),isNew=t&&Date.now()-t<7*864e5;
    document.title=(j.title||'Job')+' | Rajasthan Job';
    const raw=String(j.applyLink||j.apply||j.applicationLink||'').trim();
    const apply=/^https?:\/\//i.test(raw)?raw:'';
    const url=location.href,msg=encodeURIComponent((j.title||'Job')+' — '+(j.company||'')+' ('+(j.location||'Rajasthan')+')\n'+url);
    const wa='https://wa.me/?text='+msg;
    $('head').innerHTML=`<div class="co">${esc(j.company||'')}${isNew?'<span class="tag">NEW</span>':''}</div><h1>${esc(j.title||'Job Vacancy')}</h1><div class="co">📍 ${esc(j.location||'Rajasthan')}</div>`;
    const f=(l,v,c='')=>v?`<div class="fact ${c}"><small>${l}</small><b>${esc(v)}</b></div>`:'';
    $('content').innerHTML=`<div class="facts">${f('Salary',j.salary||'Not specified','sal')}${f('Experience',j.experience||'Any experience')}${f('Job type',j.type||'Full Time')}${f('Qualification',j.qualification||'Not specified')}${f('Deadline',j.deadline)}</div>
<div class="actions">${apply?`<a class="btn apply" href="${esc(apply)}" target="_blank" rel="noopener noreferrer">Apply Now</a>`:''}<a class="btn ghost wa" href="${wa}" target="_blank" rel="noopener noreferrer">WhatsApp par share</a><button class="btn ghost" id="cp" type="button">Link copy</button></div>
<div class="sec"><h2>Job Description</h2><p>${esc(j.description||'Details employer ke apply page par available hain.').replace(/\n/g,'<br>')}</p></div>
${j.notes?`<div class="sec"><h2>Additional Information</h2><p>${esc(j.notes).replace(/\n/g,'<br>')}</p></div>`:''}
<div class="note">Apply karne se pehle vacancy aur application link ek baar verify zaroor karein.</div>`;
    $('cp').onclick=async()=>{try{await navigator.clipboard.writeText(url);toast()}catch(e){prompt('Link copy karein:',url)}};
    if(apply){$('stickyApply').href=apply}else{$('stickyApply').style.display='none'}
    $('stickyWa').onclick=()=>window.open(wa,'_blank','noopener');
    $('sticky').classList.add('on');
    similar(j);
  }catch(e){console.error(e);fail('Job load nahi ho saki','Internet check karke page refresh karein.')}
}
async function similar(j){
  try{
    const s=await getDocs(query(collection(db,'jobs'),where('status','==','approved')));
    const loc=String(j.location||'').toLowerCase(),cat=String(j.category||'').toLowerCase();
    const list=s.docs.map(d=>({id:d.id,...d.data()})).filter(x=>x.id!==id)
      .map(x=>({x,sc:(String(x.category||'').toLowerCase()===cat&&cat?2:0)+(String(x.location||'').toLowerCase()===loc&&loc?1:0)}))
      .sort((a,b)=>b.sc-a.sc||ms(b.x)-ms(a.x)).slice(0,3).map(o=>o.x);
    if(!list.length)return;
    $('simg').innerHTML=list.map(x=>`<a class="sc" href="job-detail.html?id=${encodeURIComponent(x.id)}"><b>${esc(x.title||'Job')}</b><span>${esc(x.company||'')} · ${esc(x.location||'')}</span></a>`).join('');
    $('sim').hidden=false;
  }catch(e){console.error(e)}
}
load();
</script><script type="module" src="assets/rch-analytics-tracker.js"></script>
</body></html>
