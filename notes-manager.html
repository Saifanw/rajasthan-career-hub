<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notes Manager | Rajasthan Job</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f7fb;color:#102b49}.wrap{width:min(1100px,92%);margin:auto}header{background:linear-gradient(135deg,#102f4d,#1769e8);color:#fff;padding:20px 0}h1{margin:0}header p{margin:5px 0;color:#dbeafe}.panel{background:#fff;border:1px solid #d9e3ef;border-radius:16px;padding:18px;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{padding:14px;background:#f5f9ff;border:1px solid #d9e8f7;border-radius:12px}.stat b{display:block;font-size:25px}.row{border:1px solid #dce5ef;border-radius:13px;padding:15px;margin:11px 0}.top{display:flex;justify-content:space-between;gap:10px}.badge{border-radius:999px;padding:5px 9px;font-size:10px;font-weight:800}.pending{background:#fff3d6;color:#8a5a00}.approved{background:#e9f7ef;color:#087443}.rejected{background:#ffe9e9;color:#b42318}.meta{font-size:12px;color:#60738a;line-height:1.6;margin:6px 0}.btn{border:0;border-radius:8px;padding:8px 11px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.approve{background:#e7f7ee;color:#087443}.reject{background:#fff3d6;color:#8a5a00}.delete{background:#ffe9e9;color:#b42318}.open{background:#eaf3ff;color:#1769e8}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.login{max-width:450px;margin:70px auto;text-align:center}.hidden{display:none}.err{color:#b42318;background:#fff0f0;padding:10px;border-radius:8px;margin-top:10px}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.top{flex-direction:column}}</style></head><body>
<header><div class="wrap"><h1>📚 Notes Manager</h1><p>Review public uploads before publishing.</p></div></header>
<div id="login" class="login"><div class="panel"><h2>🔐 Admin Login</h2><button class="btn open" id="loginBtn">Login with Google</button><div id="loginMsg"></div></div></div>
<main id="app" class="wrap hidden"><div class="stats"><div class="stat">📚<b id="total">0</b>Total</div><div class="stat">🕒<b id="pending">0</b>Pending</div><div class="stat">✅<b id="approved">0</b>Approved</div></div><div class="panel"><h2>Submitted Notes</h2><div id="list">Loading…</div></div></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";import {getFirestore,collection,getDocs,doc,updateDoc,deleteDoc} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";import {getStorage,ref,deleteObject} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-storage.js";
const firebaseConfig = {
  apiKey: "AIzaSyDO75-iuVlRP9emqnR-d1T4g66akuQS328",
  authDomain: "rajasthan-job.firebaseapp.com",
  projectId: "rajasthan-job",
  storageBucket: "rajasthan-job.firebasestorage.app",
  messagingSenderId: "894888753938",
  appId: "1:894888753938:web:92e66d7a7237be1fd9d1cb",
  measurementId: "G-15S2XJQK80"
};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app),ADMIN="saif.anwar1618@gmail.com",$=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function load(){const s=await getDocs(collection(db,"notes")),a=s.docs.map(d=>({id:d.id,...d.data()}));$("total").textContent=a.length;$("pending").textContent=a.filter(x=>x.status==="pending").length;$("approved").textContent=a.filter(x=>x.status==="approved").length;$("list").innerHTML=a.length?a.map(x=>`<div class="row"><div class="top"><div><b>${esc(x.title)}</b><div class="meta">👤 ${esc(x.name)} • ✉️ ${esc(x.email)} • 📚 ${esc(x.category)}</div></div><span class="badge ${x.status==="approved"?"approved":x.status==="rejected"?"rejected":"pending"}">${esc((x.status||"pending").toUpperCase())}</span></div><div class="meta">${esc(x.description||"")}<br>📄 ${esc(x.fileName||"")}</div><div class="actions"><a class="btn open" target="_blank" href="${esc(x.fileUrl)}">👁️ Open File</a>${x.status!=="approved"?`<button class="btn approve" onclick="approve('${x.id}')">✓ Approve</button>`:""}${x.status!=="rejected"?`<button class="btn reject" onclick="reject('${x.id}')">✕ Reject</button>`:""}<button class="btn delete" onclick="removeNote('${x.id}')">🗑 Delete</button></div></div>`).join(""):"No submissions yet."}
window.approve=async id=>{await updateDoc(doc(db,"notes",id),{status:"approved"});load()};window.reject=async id=>{await updateDoc(doc(db,"notes",id),{status:"rejected"});load()};window.removeNote=async id=>{if(!confirm("Delete this note permanently?"))return;const x=(await getDocs(collection(db,"notes"))).docs.find(d=>d.id===id);if(x){const data=x.data();await deleteDoc(doc(db,"notes",id));if(data.storagePath){try{await deleteObject(ref(storage,data.storagePath))}catch(e){}}}load()};
$("loginBtn").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){$("loginMsg").innerHTML='<div class="err">'+esc(e.message)+'</div>'}};onAuthStateChanged(auth,u=>{if(u&&u.email.toLowerCase()===ADMIN){$("login").classList.add("hidden");$("app").classList.remove("hidden");load()}else if(u)signOut(auth)});
</script></body></html>
