<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free ATS Resume Builder | Rajasthan Job</title>
<meta name="description" content="Build a clean, ATS-friendly resume for free. Live preview, health check and PDF download. Your resume stays in your browser.">
<link rel="stylesheet" href="assets/rch-site.css">
<link rel="stylesheet" href="assets/rb-builder.css">
</head>
<body>
<main class="rb" data-rch-private data-view="edit">
  <div class="rbTool" role="toolbar" aria-label="Resume settings">
    <label>Template<select id="tpl"><option value="classic">ATS Classic</option><option value="compact">ATS Compact</option><option value="navy">Modern Navy</option><option value="serif">Executive Serif</option></select></label>
    <label>Colour<input type="color" id="acc" value="#1450d6"></label>
    <label>Font<select id="ff"><option value="plex">IBM Plex Sans</option><option value="arial">Arial</option><option value="georgia">Georgia</option></select></label>
    <label>Size<select id="fs"><option value="10">10 pt</option><option value="10.5" selected>10.5 pt</option><option value="11">11 pt</option></select></label>
    <label>Spacing<select id="gap"><option value="0.7">Tight</option><option value="1" selected>Normal</option><option value="1.3">Roomy</option></select></label>
    <span class="rbSp"></span>
    <button class="rbB" id="undo" type="button">Undo</button><button class="rbB" id="redo" type="button">Redo</button>
    <button class="rbB" id="clear" type="button">Clear sample</button>
    <button class="rbB" id="exp" type="button">Export JSON</button>
    <label class="rbB rbFile">Import JSON<input type="file" id="imp" accept="application/json" hidden></label>
    <button class="rbB pri" id="dl" type="button">Download PDF</button>
  </div>
  <div class="rbSeg" role="tablist" aria-label="View"><button type="button" role="tab" data-v="edit" aria-selected="true">Edit</button><button type="button" role="tab" data-v="preview" aria-selected="false">Preview</button></div>
  <div class="rbGrid">
    <section class="rbForm" aria-label="Resume form">
      <div id="health" class="rbHealth"></div>
      <div id="form"></div>
      <details class="rbSec"><summary>Sections: show, hide, reorder</summary><div id="order" class="rbBody"></div></details>
      <p class="rbNote">Privacy: your resume stays in this browser (autosaved on this device). Nothing is uploaded. Add only what is true. Hum kisi selection ki guarantee nahi dete; ek saaf resume aapke chance behtar karta hai.</p>
    </section>
    <section class="rbPrev" aria-label="Live preview"><div class="rbPg" id="pg"></div><div class="rbWrap" id="wrap"><div class="rbScale" id="scale"><article class="paper" id="paper"></article></div></div></section>
  </div>
  <div class="rbMobile"><button class="rbB pri" id="dl2" type="button">Download PDF</button></div>
</main>
<script type="module" src="assets/rb-app.js"></script>
<script type="module" src="assets/rch-analytics-tracker.js"></script>
</body>
</html>
