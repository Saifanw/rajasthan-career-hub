<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Rajasthan Job — Notification Manager</title>
<style>
:root{--navy:#102a43;--blue:#1769e8;--green:#16865b;--red:#d84b4b;--bg:#f5f8fc;--line:#dce5ef;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:#182536}
header{background:var(--navy);color:#fff;padding:20px 5%}header .in{max-width:1050px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:24px;margin:0}header small{display:block;color:#dce9f8;margin-top:3px}
.wrap{max-width:1050px;width:92%;margin:25px auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 8px 25px #102a430b;margin-bottom:18px}
h2{margin:0 0 15px;color:var(--navy);font-size:21px}
label{display:block;font-size:13px;font-weight:800;color:var(--navy);margin:12px 0 6px}
input,textarea,select{width:100%;padding:12px;border:1px solid #ccd9e7;border-radius:9px;font:inherit}textarea{min-height:105px;resize:vertical}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.btn{border:0;border-radius:9px;padding:11px 16px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:#fff}.light{background:#fff;border:1px solid #cbd8e7;color:var(--navy)}.danger{background:#fff0f0;color:var(--red);border:1px solid #f2cccc}.green{background:var(--green);color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.status{display:none;margin-top:12px;padding:11px;border-radius:9px;font-size:13px;font-weight:750}
.item{border:1px solid var(--line);border-radius:13px;padding:15px;margin-top:10px}.itemtop{display:flex;justify-content:space-between;gap:10px}.item h3{margin:0;color:var(--navy);font-size:16px}.date{font-size:11px;color:var(--muted)}.msg{font-size:13px;color:#40516a;margin:6px 0}.badge{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:900}.published{background:#eaf8f1;color:#11623f}.draft{background:#eef2f7;color:#40516a}
.hidden{display:none}.login{text-align:center;padding:35px}.user{font-size:12px;color:var(--muted)}
@media(max-width:650px){.grid{grid-template-columns:1fr}header .in{display:block}.topbar{display:block}.topbar .actions{margin-top:10px}}
</style>
</head>
<body>
<header><div class="in"><div><h1>Rajasthan Job — Notification Manager</h1><small>Admin panel • Homepage live updates</small></div><div id="userArea"></div></div></header>

<div class="wrap">
  <div id="loginBox" class="card login">
    <h2>Admin Login</h2>
    <p class="user">Google se login karke notifications manage karein.</p>
    <button id="loginBtn" class="btn primary">🔐 Login with Google</button>
    <div id="loginStatus" class="status"></div>
  </div>

  <div id="adminArea" class="hidden">
    <div class="topbar">
      <div><strong>🔔 Notifications</strong><div class="user">Published notification homepage ke top par automatically show hogi.</div></div>
      <div class="actions"><a class="btn light" href="index.html">Website</a><button id="logoutBtn" class="btn light">Logout</button></div>
    </div>

    <div class="card">
      <h2 id="formTitle">➕ Add Notification</h2>
      <form id="noticeForm">
        <div class="grid">
          <div><label>Notification Title *</label><input id="title" required maxlength="120" placeholder="Rajasthan CET 2026 Update"></div>
          <div><label>Status *</label><select id="status"><option value="published">Published — homepage par show</option><option value="draft">Draft — homepage par nahi</option></select></div>
        </div>
        <label>Message / Short Update *</label>
        <textarea id="message" required maxlength="500" placeholder="Important date, vacancy update, exam update..."></textarea>
        <div class="actions">
          <button id="saveBtn" class="btn primary" type="submit">Publish Notification</button>
          <button id="cancelBtn" class="btn light hidden" type="button">Cancel Edit</button>
        </div>
        <div id="formStatus" class="status"></div>
      </form>
    </div>

    <div class="card">
      <h2>📋 All Notifications</h2>
      <div id="list"><div class="user">Loading...</div></div>
    </div>
  </div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";
import {getFirestore,collection,addDoc,updateDoc,deleteDoc,doc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyDO75-iuVlRP9emqnR-d1T4g66akuQS328",
 authDomain:"rajasthan-job.firebaseapp.com",
 projectId:"rajasthan-job",
 storageBucket:"rajasthan-job.firebasestorage.app",
 messagingSenderId:"894888753938",
 appId:"1:894888753938:web:92e66d7a7237be1fd9d1cb",
 measurementId:"G-15S2XJQK80"
};
const app=initializeApp(firebaseConfig,"notification-manager");
const auth=getAuth(app),db=getFirestore(app);
const ADMIN_EMAIL="saif.anwar1618@gmail.com";
const loginBox=document.getElementById("loginBox"),adminArea=document.getElementById("adminArea");
const loginStatus=document.getElementById("loginStatus"),formStatus=document.getElementById("formStatus");
const userArea=document.getElementById("userArea"),list=document.getElementById("list");
const form=document.getElementById("noticeForm"),saveBtn=document.getElementById("saveBtn");
let editId=null,unsubscribe=null;

function showStatus(el,text,ok=false){
 el.style.display="block";el.textContent=text;
 el.style.background=ok?"#edf8f2":"#fff5f5";el.style.color=ok?"#11623f":"#a63d3d";el.style.border="1px solid "+(ok?"#c9ead9":"#f2cccc");
}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function fmt(t){try{return t?.toDate?new Intl.DateTimeFormat("en-IN",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(t.toDate()):""}catch{return""}}

document.getElementById("loginBtn").onclick=async()=>{
 try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){showStatus(loginStatus,"Login failed: "+e.message)}
};
document.getElementById("logoutBtn").onclick=()=>signOut(auth);

onAuthStateChanged(auth,user=>{
 if(!user){loginBox.classList.remove("hidden");adminArea.classList.add("hidden");userArea.innerHTML="";if(unsubscribe)unsubscribe();return}
 if(user.email!==ADMIN_EMAIL){
   showStatus(loginStatus,"This Google account is not authorised for the admin panel.");
   signOut(auth);return;
 }
 loginBox.classList.add("hidden");adminArea.classList.remove("hidden");
 userArea.innerHTML=`Signed in: ${esc(user.email)}`;
 load();
});

function load(){
 const q=query(collection(db,"announcements"),orderBy("createdAt","desc"));
 unsubscribe=onSnapshot(q,snap=>{
  if(!snap.docs.length){list.innerHTML='<div class="user">No notifications yet.</div>';return}
  list.innerHTML=snap.docs.map(d=>{
   const a=d.data(),st=a.status==="published";
   return `<div class="item">
    <div class="itemtop"><h3>${esc(a.title||"Untitled")}</h3><span class="badge ${st?"published":"draft"}">${st?"PUBLISHED":"DRAFT"}</span></div>
    <div class="date">${esc(fmt(a.createdAt))}</div>
    <div class="msg">${esc(a.message||"")}</div>
    <div class="actions">
      <button class="btn light" data-edit="${d.id}">Edit</button>
      <button class="btn danger" data-delete="${d.id}">Delete</button>
    </div>
   </div>`
  }).join("");
  list.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>editNotice(b.dataset.edit,snap.docs.find(x=>x.id===b.dataset.edit).data()));
  list.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>deleteNotice(b.dataset.delete));
 },e=>showStatus(formStatus,"Could not load notifications: "+e.message));
}

form.onsubmit=async e=>{
 e.preventDefault();
 const title=document.getElementById("title").value.trim(),message=document.getElementById("message").value.trim(),status=document.getElementById("status").value;
 saveBtn.disabled=true;saveBtn.textContent="Saving...";
 try{
  if(editId){
   await updateDoc(doc(db,"announcements",editId),{title,message,status,updatedAt:serverTimestamp()});
   showStatus(formStatus,"✅ Notification updated.",true);
  }else{
   await addDoc(collection(db,"announcements"),{title,message,status,createdAt:serverTimestamp(),createdBy:auth.currentUser.email});
   showStatus(formStatus,"✅ Notification saved.",true);
  }
  resetForm();
 }catch(e){showStatus(formStatus,"❌ Save failed: "+e.message)}
 finally{saveBtn.disabled=false;saveBtn.textContent=editId?"Update Notification":"Publish Notification"}
};
function editNotice(id,a){
 editId=id;document.getElementById("title").value=a.title||"";document.getElementById("message").value=a.message||"";document.getElementById("status").value=a.status||"draft";
 document.getElementById("formTitle").textContent="✏️ Edit Notification";saveBtn.textContent="Update Notification";document.getElementById("cancelBtn").classList.remove("hidden");window.scrollTo({top:0,behavior:"smooth"});
}
function resetForm(){editId=null;form.reset();document.getElementById("status").value="published";document.getElementById("formTitle").textContent="➕ Add Notification";document.getElementById("cancelBtn").classList.add("hidden");saveBtn.textContent="Publish Notification"}
document.getElementById("cancelBtn").onclick=resetForm;
async function deleteNotice(id){if(!confirm("Delete this notification?"))return;try{await deleteDoc(doc(db,"announcements",id))}catch(e){showStatus(formStatus,"Delete failed: "+e.message)}}
</script>
</body>
</html>
