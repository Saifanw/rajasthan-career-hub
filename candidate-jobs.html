<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Selected Jobs | Rajasthan Career Hub</title><style>
:root{--navy:#102b4e;--blue:#1769d2;--bg:#f3f6fa;--line:#dfe7f0;--muted:#63748a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:#182536}header{background:var(--navy);color:white;padding:22px 5%}.wrap{max-width:900px;margin:28px auto;padding:0 16px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;margin:14px 0}.job h2{margin:0 0 8px;color:var(--navy)}.muted{color:var(--muted);font-size:14px}.pill{display:inline-block;background:#edf4ff;border-radius:20px;padding:5px 9px;font-size:12px;margin:4px 4px 4px 0}.btn{display:inline-block;background:var(--blue);color:white;text-decoration:none;padding:11px 16px;border-radius:8px;font-weight:bold}.status{text-align:center;padding:40px}.desc{white-space:pre-wrap;line-height:1.55}@media(max-width:600px){.card{padding:16px}}
</style></head><body><header><h1 style="margin:0">Rajasthan Career Hub</h1><div style="margin-top:6px">Jobs selected for you</div></header><main class="wrap"><div id="status" class="card status">Loading your selected jobs…</div><div id="jobs"></div><p class="muted" style="text-align:center">This page contains selected job information only. Please verify job details and eligibility with the employer before applying.</p></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDO75-iuVlRP9emqnR-d1T4g66akuQS328",authDomain:"rajasthan-job.firebaseapp.com",projectId:"rajasthan-job",storageBucket:"rajasthan-job.firebasestorage.app",messagingSenderId:"894888753938",appId:"1:894888753938:web:92e66d7a7237be1fd9d1cb",measurementId:"G-15S2XJQK80"};
const app=initializeApp(firebaseConfig,"candidate-job-page"),db=getFirestore(app);const status=document.getElementById("status"),jobs=document.getElementById("jobs");
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function safeUrl(v){try{const u=new URL(v);return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}}
const token=new URLSearchParams(location.search).get("token");
if(!token||!/^[a-f0-9]{64}$/.test(token)){status.textContent="This job link is missing or invalid. Please contact the person who shared it with you."}
else{try{const snap=await getDoc(doc(db,"candidateJobPages",token));if(!snap.exists()||!Array.isArray(snap.data().jobs)){status.textContent="This link is invalid or no longer available."}else{const data=snap.data().jobs;status.textContent=data.length?`${data.length} job(s) selected for you`:"No jobs have been selected yet.";jobs.innerHTML=data.map(j=>{const apply=safeUrl(j.apply);return `<article class="card job"><h2>${esc(j.title||"Job opportunity")}</h2><b>${esc(j.company||"")}</b><p class="muted">${esc(j.location||"")}</p><div>${[j.type,j.experience,j.salary,j.qualification,j.deadline?"Last date: "+j.deadline:""].filter(Boolean).map(x=>`<span class="pill">${esc(x)}</span>`).join("")}</div>${j.description?`<h3>Job details</h3><div class="desc">${esc(j.description)}</div>`:""}${apply?`<p style="margin-top:18px"><a class="btn" href="${esc(apply)}" target="_blank" rel="noopener noreferrer">Apply / View Official Link</a></p>`:"<p class="muted">Please contact the person who shared this list for the application link.</p>"}</article>`}).join("")}}catch(e){status.textContent="Could not load jobs. Please try again later or contact the person who shared the link.";console.error(e)}}
</script></body></html>
