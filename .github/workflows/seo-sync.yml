name: Sync job pages and sitemap

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate job pages and sitemap
        run: node scripts/generate-seo.mjs
      - name: Commit changes
        run: |
          git config user.name "rajasthan-job-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A job sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Sync job pages and sitemap"
            git push
          fi
