<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Post a Job | Rajasthan Job</title>
<style>:root{--navy:#102a43;--blue:#1769e8;--bg:#f6f8fc;--line:#dfe7ef;--muted:#64748b;--green:#11623f}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#182536}a{text-decoration:none;color:inherit}.wrap{width:min(920px,94%);margin:auto}header{background:var(--navy);color:#fff;padding:17px 0}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:21px;font-weight:900}.btn{display:inline-block;border:0;border-radius:9px;padding:11px 15px;font-weight:850;cursor:pointer}.light{background:#fff;color:var(--navy)}.primary{background:var(--blue);color:#fff}main{padding:35px 0 60px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px #102a4308}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:900;color:var(--navy);margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #cfd9e3;border-radius:9px;font:inherit}textarea{min-height:140px;resize:vertical}.hint{color:var(--muted);font-size:12px;line-height:1.6}.msg{display:none;margin-top:14px;padding:12px;border-radius:9px}.success{background:#edf8f2;color:var(--green)}.error{background:#fff0f0;color:#a63d3d}@media(max-width:650px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.head{gap:10px;flex-direction:column;align-items:flex-start}}</style></head><body>
<header><div class="wrap head"><div class="brand">Rajasthan Job</div><a class="btn light" href="jobs.html">View Jobs</a></div></header>
<main><div class="wrap"><div class="card"><h1>🏢 Post a Job</h1><p class="hint">Vacancy submit karein. Har submission pehle <b>Pending</b> review mein jayegi; approval ke baad hi public Jobs page par dikhegi.</p>
<form id="jobForm"><div class="grid"><div><label>Job Title *</label><input id="title" required></div><div><label>Company Name *</label><input id="company" required></div>
<div><label>Location *</label><input id="location" placeholder="Jaipur, Rajasthan" required></div><div><label>Category *</label><select id="category" required><option value="">Select</option><option>Private</option><option>Government</option><option>Data & MIS</option><option>Sales</option><option>IT</option><option>Manufacturing</option><option>Other</option></select></div>
<div><label>Experience</label><input id="experience" placeholder="Fresher / 1–3 Years"></div><div><label>Job Type</label><select id="jobType"><option>Full Time</option><option>Part Time</option><option>Internship</option><option>Contract</option><option>Work From Home</option></select></div>
<div><label>Salary / CTC</label><input id="salary"></div><div><label>Qualification</label><input id="qualification"></div>
<div class="full"><label>Job Description *</label><textarea id="description" required></textarea></div><div><label>Official / Authorized Apply Link *</label><input id="applyLink" type="url" placeholder="https://..." required></div><div><label>Last Date</label><input id="lastDate" type="date"></div>
<div><label>Contact Email</label><input id="contactEmail" type="email"></div><div><label>Employer Contact Number</label><input id="contactPhone"></div><div class="full"><label>Additional Note</label><textarea id="note" style="min-height:90px"></textarea></div></div>
<button class="btn primary" id="submitBtn" style="margin-top:18px" type="submit">📤 Submit Job</button><a class="btn light" href="index.html" style="margin-left:7px">Cancel</a><div id="msg" class="msg"></div></form></div></div></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getFirestore,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDO75-iuVlRP9emqnR-d1T4g66akuQS328",authDomain:"rajasthan-job.firebaseapp.com",projectId:"rajasthan-job",storageBucket:"rajasthan-job.firebasestorage.app",messagingSenderId:"894888753938",appId:"1:894888753938:web:92e66d7a7237be1fd9d1cb",measurementId:"G-15S2XJQK80"};
const db=getFirestore(initializeApp(firebaseConfig,"postJobPage")), $=id=>document.getElementById(id);
$("jobForm").addEventListener("submit",async e=>{e.preventDefault();const btn=$("submitBtn"),msg=$("msg");btn.disabled=true;btn.textContent="Submitting...";msg.style.display="none";
const job={title:$("title").value.trim(),company:$("company").value.trim(),location:$("location").value.trim(),category:$("category").value,experience:$("experience").value.trim(),type:$("jobType").value,jobType:$("jobType").value,salary:$("salary").value.trim(),qualification:$("qualification").value.trim(),description:$("description").value.trim(),apply:$("applyLink").value.trim(),applyLink:$("applyLink").value.trim(),contactEmail:$("contactEmail").value.trim(),contactPhone:$("contactPhone").value.trim(),lastDate:$("lastDate").value,deadline:$("lastDate").value,note:$("note").value.trim(),notes:$("note").value.trim(),status:"pending",source:"employer_submission",createdAt:serverTimestamp(),updatedAt:serverTimestamp()};
try{const ref=await addDoc(collection(db,"jobs"),job);try{await addDoc(collection(db,"activities"),{type:"job",title:"New Job Submitted",message:job.title+" — "+job.company+" • "+job.location+" • Pending",jobId:ref.id,createdAt:serverTimestamp(),read:false})}catch(activityError){console.warn("Activity notification could not be created:",activityError)}
msg.className="msg success";msg.innerHTML="<b>Job submitted successfully.</b><br>Vacancy abhi Pending review mein hai. Approval ke baad public Jobs page par dikhegi.";msg.style.display="block";$("jobForm").reset()}catch(err){console.error(err);msg.className="msg error";msg.textContent="Job submit nahi hua. Firebase Firestore rules check karein.";msg.style.display="block"}finally{btn.disabled=false;btn.textContent="📤 Submit Job"}});
</script></body></html>
